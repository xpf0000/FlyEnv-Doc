<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Gitea local stack placeholder</title>
  <desc id="desc">A replaceable placeholder preview for a Gitea stack in FlyEnv.</desc>
  <rect width="960" height="420" rx="28" fill="#15253b"/>
  <rect x="32" y="32" width="896" height="54" rx="14" fill="#203854"/>
  <text x="60" y="66" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Gitea workspace</text>
  <rect x="32" y="112" width="260" height="270" rx="18" fill="#1e3653"/>
  <text x="60" y="155" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="15">SERVICES</text>
  <text x="60" y="194" fill="#eff6ff" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Gitea + MySQL</text>
  <text x="60" y="232" fill="#86efac" font-family="system-ui, sans-serif" font-size="16">● Running</text>
  <text x="60" y="286" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="15">LOCAL SITE</text>
  <text x="60" y="320" fill="#eff6ff" font-family="system-ui, sans-serif" font-size="17">git.test</text>
  <rect x="320" y="112" width="608" height="270" rx="18" fill="#eff6ff"/>
  <text x="360" y="165" fill="#1e3a8a" font-family="system-ui, sans-serif" font-size="30" font-weight="800">Gitea</text>
  <rect x="360" y="194" width="170" height="34" rx="17" fill="#dbeafe"/><text x="385" y="217" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="15" font-weight="700">HTTPS enabled</text>
  <text x="360" y="278" fill="#405a7c" font-family="system-ui, sans-serif" font-size="18">Native local stack preview</text>
  <text x="360" y="320" fill="#617797" font-family="system-ui, sans-serif" font-size="15">FlyEnv workspace preview</text>
</svg>

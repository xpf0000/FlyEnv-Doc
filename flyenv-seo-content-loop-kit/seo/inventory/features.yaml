# Bootstrap placeholder. Codex must rebuild this from the current repository before creating Feature pages.

groups: []

discovery_rules:
  include:
    - stable user-facing modules
    - stable runtimes
    - stable web servers
    - stable databases
    - stable cache/message-queue services
    - stable storage/infrastructure modules
    - stable database management tools
    - stable workflow/productivity modules
    - stable AI/MCP capabilities
  exclude:
    - internal-only implementation details
    - deprecated modules
    - roadmap-only features
    - experiments not available to normal users
    - tiny utilities without enough independent search/user value
